<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      html, body {
        background-color: #09080e !important;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent !important;
        -webkit-touch-callout: none !important;
      }
      html[data-theme="light"], html[data-theme="light"] body {
        background-color: #f6f4fa !important;
      }
      #apk-ambient-bg {
        position: fixed !important;
        inset: 0 !important;
        width: 100vw !important;
        height: 100vh !important;
        background-color: #09080e !important;
        background-image: url('/bg-app-wallpaper.jpg') !important;
        background-attachment: fixed !important;
        background-size: cover !important;
        background-position: center center !important;
        background-repeat: no-repeat !important;
        z-index: -10 !important;
        pointer-events: none !important;
        transform: translateZ(0) !important;
      }
      html[data-theme="light"] #apk-ambient-bg {
        background-color: #f6f4fa !important;
        background-image: url('/bg-app-wallpaper-light.jpg') !important;
        background-size: cover !important;
        background-position: center center !important;
        background-repeat: no-repeat !important;
        opacity: 1 !important;
      }
      #apk-hamburger-btn {
        position: absolute !important;
        top: max(14px, env(safe-area-inset-top, 14px)) !important;
        left: 14px !important;
        z-index: 25000 !important;
        width: 36px !important;
        height: 36px !important;
        min-width: 36px !important;
        min-height: 36px !important;
        max-width: 36px !important;
        max-height: 36px !important;
        display: inline-flex !important;
        align-items: center !important;
        justify-content: center !important;
        opacity: 1 !important;
        visibility: visible !important;
        pointer-events: auto !important;
        margin: 0 !important;
        padding: 0 !important;
        background: rgba(30, 22, 54, 0.72) !important;
        border: 1px solid rgba(255, 255, 255, 0.16) !important;
        border-radius: 10px !important;
        backdrop-filter: blur(24px) saturate(180%) !important;
        -webkit-backdrop-filter: blur(24px) saturate(180%) !important;
        box-shadow: 2.5px 2.5px 0 0 #8E74E5, 0 4px 14px rgba(0, 0, 0, 0.28) !important;
        color: #ffffff !important;
        cursor: pointer !important;
        transform: translateZ(0) !important;
        -webkit-tap-highlight-color: transparent !important;
        outline: none !important;
      }
      [data-theme="light"] #apk-hamburger-btn {
        background: rgba(255, 255, 255, 0.88) !important;
        border: 1px solid rgba(142, 116, 229, 0.38) !important;
        box-shadow: 2.5px 2.5px 0 0 #8E74E5, 0 4px 14px rgba(108, 79, 214, 0.2) !important;
        color: #1e1b4b !important;
      }
      #apk-hamburger-btn svg {
        width: 18px !important;
        height: 18px !important;
        stroke: currentColor !important;
        stroke-width: 2.3 !important;
        fill: none !important;
        display: block !important;
      }
      @keyframes iosPageGlideIn {
        from {
          opacity: 0;
          transform: translate3d(0, 10px, 0);
        }
        to {
          opacity: 1;
          transform: translate3d(0, 0, 0);
        }
      }
      main, #catalog-view, #notes-catalog-view, #tests-catalog-view, .main-container {
        animation: iosPageGlideIn 0.24s cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      button, a, .nav-tab {
        -webkit-tap-highlight-color: transparent !important;
        outline: none !important;
      }
    </style>
    <script>
      (function(){
        try {
          var t = localStorage.getItem('nnl_app_theme');
          if (!t) {
            t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', t);
          if (window.AndroidBridge || window.__NNL_ANDROID_APK__ || (navigator.userAgent && /NightingaleAndroid/i.test(navigator.userAgent))) {
            document.documentElement.classList.add('is-native-android-apk');
          }
          var isGuest = localStorage.getItem('nnl_guest_mode') === 'true' || localStorage.getItem('nnl_access_token') === 'GUEST_OPEN_ACCESS';
          var token = localStorage.getItem('token') || localStorage.getItem('nnl_access_token') || localStorage.getItem('nnl_auth_token') || (isGuest ? 'GUEST_OPEN_ACCESS' : null);
          if (token || isGuest) {
            document.documentElement.classList.add('is-logged-in');
            var s = document.createElement('style');
            s.textContent = '#app-preloader{display:none!important;} #apk-hamburger-btn{display:inline-flex!important;visibility:visible!important;opacity:1!important;pointer-events:auto!important;}';
            document.head.appendChild(s);
          }
        } catch(e) {}
      })();
    </script>
    <meta name="description" content="Nightingale Study Notes & PDFs — Minimal, high-speed medical academic repository." />
    <title>Nightingale — Notes &amp; PDFs</title>
  </head>
  <body class="notes-theme-page">
    <!-- Ambient Single Unified Background Layer -->
    <div id="apk-ambient-bg"></div>

    <!-- Options Button (Fixed Top-Left across all pages, zero overlap with island) -->
    <button id="apk-hamburger-btn" class="apk-hamburger-btn" type="button" aria-label="Open Menu &amp; Settings">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
    </button>

    <!-- Top Navigation Header (Floating Island) -->
    <header id="app-header" class="app-header">
      <nav class="header-nav-tabs">
        <div class="nav-tabs" style="margin: 0 !important;">
          <button id="tab-live" class="nav-tab" onclick="window.location.href='/'">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <span>Home</span>
          </button>

          <button id="tab-videos" class="nav-tab" onclick="window.location.href='/all-videos.html'">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><polygon points="6 4 20 12 6 20 6 4"/></svg>
            <span>Videos</span>
          </button>

          <button id="tab-notes" class="nav-tab active">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="13" y2="17"/></svg>
            <span>Notes</span>
          </button>

          <button id="tab-tests" class="nav-tab" onclick="window.location.href='/tests.html'">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
            <span>Tests</span>
          </button>

          <button id="tab-saved" class="nav-tab" onclick="window.location.href='/saved.html'">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
            <span>Saved</span>
          </button>

          <button id="tab-pyqs" class="nav-tab" type="button" aria-label="University Question Papers" onclick="window.location.href='/pyqs.html';">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M2 10h20M12 3 2 10h20zM6 10v11M10 10v11M14 10v11M18 10v11"/></svg>
            <span>University</span>
          </button>
        </div>
      </nav>

      <!-- Right Header Actions (Batch Selector) -->
      <div class="header-right-actions">
        <div class="batch-dropdown-container">
          <button id="header-batch-btn" class="nav-btn">
            <span id="current-batch-label">Red Sapphire (Hinglish)</span>
            <svg width="9" height="9" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" style="margin-left: 5px; display: inline-block; vertical-align: middle;"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5"></path></svg>
          </button>
          <div id="header-batch-dropdown" class="header-batch-dropdown hide">
            <!-- Dynamically populated via JS -->
          </div>
        </div>
      </div>
    </header>

    <!-- Main Academic Notes Application -->
    <main id="app">
      <div class="notes-page-container">

        <!-- Compact Header: "Notes" + Search Icon Button -->
        <section class="notes-hero-header">
          <div class="notes-hero-bar">
            <h1 class="notes-hero-title">Notes</h1>
            <div id="notes-search-box" class="notes-search-wrapper">
              <svg class="notes-search-icon" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z"/>
              </svg>
              <input 
                type="text" 
                id="notes-search-input" 
                class="notes-search-input" 
                placeholder="Search subjects or PDFs..." 
                autocomplete="off" 
              />
              <button id="notes-search-clear" class="notes-search-clear" title="Clear Search" aria-label="Clear search">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
              </button>
              <button id="notes-search-close" class="notes-search-close-btn" type="button" title="Close Search" aria-label="Close search">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
              </button>
            </div>
            <button id="notes-search-toggle" class="apk-search-toggle-btn" type="button" title="Search" aria-label="Search">
              <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.3" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z"/>
              </svg>
            </button>
          </div>
        </section>

        <!-- VIEW 1: All Subjects Catalog Grid -->
        <section id="notes-catalog-view" class="notes-catalog-view">
          <!-- Section Switcher: Red Sapphire vs All Notes (Clean pills without count clutter) -->
          <div class="section-mode-tabs">
            <button id="sec-tab-rb104" class="section-mode-tab active" data-section="rb104">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="2"/><path d="M16.24 7.76a6 6 0 0 1 0 8.49m-8.48-.01a6 6 0 0 1 0-8.49m11.31-2.83a10 10 0 0 1 0 14.14m-14.14 0a10 10 0 0 1 0-14.14"/></svg>
              <span>Red Sapphire</span>
            </button>
            <button id="sec-tab-master" class="section-mode-tab" data-section="master">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
              <span>All Notes</span>
            </button>
          </div>

          <!-- Dedicated Red Sapphire Live Status Bar (Hinglish Batch 103 + English Batch 104) -->
          <div id="rb104-status-bar" class="rb-section-header-bar hide">
            <div class="rb-section-title-wrap" style="flex-wrap:wrap;">
              <span id="rb-active-batch-badge" class="rb-section-badge">Batch 103 • Hinglish</span>
              <div style="display:inline-flex;gap:0.35rem;background:rgba(15,23,42,0.7);padding:3px;border-radius:999px;border:1px solid rgba(167,139,250,0.22);">
                <button id="rb-lang-103" class="rb-sync-btn" style="padding:0.24rem 0.65rem;font-size:0.7rem;" data-rb-id="103">Hinglish (103)</button>
                <button id="rb-lang-104" class="rb-sync-btn" style="padding:0.24rem 0.65rem;font-size:0.7rem;background:transparent;border-color:transparent;" data-rb-id="104">English (104)</button>
              </div>
              <span id="rb104-summary-text" style="font-size: 0.84rem; font-weight: 600; color: #f1f5f9;">
                Completed subjects &amp; live class notes + tests synced automatically
              </span>
            </div>
            <div style="display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap;">
              <span id="rb104-sync-status" class="rb-sync-status-pill">Auto-sync ready</span>
              <button id="rb104-sync-btn" class="rb-sync-btn">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 16h5v5"/></svg>
                <span>Sync Live</span>
              </button>
            </div>
          </div>

          <div id="subjects-grid" class="notes-subject-grid">
            <div class="cp-loading" style="grid-column: 1 / -1; padding: 5rem 2rem; text-align: center;">
              <div class="spinner"></div>
              <p style="color: var(--text-secondary); margin-top: 1rem; font-family: var(--font-display); font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase;">Loading Academic Repository...</p>
            </div>
          </div>
        </section>

        <!-- VIEW 2: Dedicated Subject Drill-down View (Row 1 Back & Title; Row 2 Left Count, Right Teacher) -->
        <section id="notes-subject-view" class="notes-subject-view hide">
          <div class="notes-detail-compact-bar">
            <div class="subject-detail-top-line">
              <button id="btn-back-subjects" class="btn-notes-back" type="button" aria-label="Go Back">
                <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18"/></svg>
                <span>Back</span>
              </button>
              <h2 id="subject-detail-title" class="subject-detail-title">Subject Title</h2>
            </div>
            <div class="subject-detail-sub-line">
              <span id="subject-detail-count" class="subject-detail-count">0 PDFs</span>
              <div class="subject-detail-teacher-box">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                <span id="subject-detail-teacher-name" class="subject-detail-teacher">Faculty</span>
              </div>
            </div>
          </div>

          <!-- Document List Container (Topic filter buttons + PDFs) -->
          <div id="notes-doc-list" class="notes-doc-list">
            <!-- Populated dynamically via JS -->
          </div>
        </section>

      </div>
    </main>

    <!-- In-App Minimal PDF Reader Modal -->
    <div id="pdf-modal" class="pdf-modal-overlay hide">
      <div class="pdf-modal-container">
        <div class="pdf-modal-header">
          <div class="pdf-modal-title" id="pdf-modal-title">Document Preview</div>
          <div class="pdf-modal-actions">
            <button id="pdf-modal-native-btn" class="btn-note-download" type="button" style="background:rgba(124,58,237,0.22);border-color:rgba(167,139,250,0.4);color:#DDD6FE;display:inline-flex;align-items:center;gap:6px;">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
              <span>Open in PDF App</span>
            </button>
            <a id="pdf-modal-download-btn" href="#" target="_blank" class="btn-note-download">
              <svg width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3"/></svg>
              <span>Open Full PDF</span>
            </a>
            <button id="pdf-modal-close-btn" class="btn-close-quiz" title="Close Preview" aria-label="Close preview">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
            </button>
          </div>
        </div>
        <div class="pdf-modal-body">
          <iframe id="pdf-modal-iframe" class="pdf-iframe" src="" title="PDF Viewer"></iframe>
        </div>
      </div>
    </div>

    <!-- Floating Settings Widget at Bottom Right -->
    <div class="cyber-tweaks-widget">
      <div class="tweaks-header" style="display: flex; align-items: center; justify-content: space-between;">
        <span style="display: flex; align-items: center; gap: 0.45rem; font-family: var(--font-display); font-size: 0.7rem; font-weight: 700; letter-spacing: 0.1em; color: var(--accent-red);">
          <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.325.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 011.37.49l1.296 2.247a1.125 1.125 0 01-.26 1.431l-1.003.827c-.293.241-.438.613-.43.992a7.723 7.723 0 010 .255c-.008.378.137.75.43.991l1.004.827c.424.35.534.955.26 1.43l-1.298 2.247a1.125 1.125 0 01-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.47 6.47 0 01-.22.128c-.331.183-.581.495-.644.869l-.213 1.281c-.09.543-.56.94-1.11.94h-2.594c-.55 0-1.019-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 01-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 01-1.369-.49l-1.297-2.247a1.125 1.125 0 01.26-1.431l1.004-.827c.292-.24.437-.613.43-.991a6.932 6.932 0 010-.255c.007-.38-.138-.751-.43-.992l-1.004-.827a1.125 1.125 0 01-.26-1.43l1.297-2.247a1.125 1.125 0 011.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.086.22-.128.332-.183.582-.495.644-.869l.214-1.28Z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0Z"/></svg>
          <span>PORTAL SETTINGS</span>
        </span>
        <div class="tweaks-pulse"></div>
      </div>
      <div class="tweaks-body" style="padding: 0.85rem; display: flex; flex-direction: column; gap: 0.85rem;">
        <div class="tweak-item" style="display: flex; align-items: center; justify-content: space-between;">
          <label style="font-size: 0.68rem; margin: 0;">ACCENT THEME</label>
          <div class="color-options" style="margin: 0;">
            <span class="color-dot color-pink active" data-color="pink" title="Crimson Red"></span>
            <span class="color-dot color-cyan" data-color="cyan" title="Neon Cyan"></span>
            <span class="color-dot color-amber" data-color="amber" title="Amber Glow"></span>
            <span class="color-dot color-emerald" data-color="emerald" title="Emerald Light"></span>
          </div>
        </div>

        <div style="height: 1px; background: rgba(255, 255, 255, 0.08); width: 100%;"></div>

        <!-- Dedicated Logout Button at Bottom Right Settings -->
        <button id="logout-btn" class="settings-logout-btn">
          <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M18 12H9m9 0l-3-3m3 3l-3 3"/></svg>
          <span>LOGOUT</span>
        </button>
      </div>
    </div>



    <!-- Script Entrypoint -->
    <script type="module" src="/src/notes.js"></script>
  </body>
</html>
