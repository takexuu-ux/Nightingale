<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <meta name="description" content="Nightingale Recorded Video Lectures — All Subjects, Faculty &amp; Red Sapphire Live Class Videos." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/style.css" />
    <title>Nightingale — All Videos</title>
    <style>
      .sd-search-box {
        position: relative;
        margin-bottom: 1.25rem;
      }
      .sd-search-box input {
        width: 100%;
        padding: 0.85rem 1.2rem 0.85rem 2.8rem;
        border-radius: 14px;
        border: 1px solid rgba(167, 139, 250, 0.22);
        background: linear-gradient(135deg, rgba(22, 28, 50, 0.82), rgba(28, 22, 46, 0.78));
        color: #fff;
        font-family: var(--font-body);
        font-size: 0.88rem;
        outline: none;
        box-sizing: border-box;
      }
      .sd-search-box input:focus {
        border-color: rgba(167, 139, 250, 0.55);
      }
      .sd-search-icon {
        position: absolute;
        left: 0.95rem;
        top: 50%;
        transform: translateY(-50%);
        color: #94a3b8;
        pointer-events: none;
      }
      .subject-lectures-container {
        display: flex;
        flex-direction: column;
        gap: 0.7rem;
      }
      .sd-lecture-card {
        display: flex;
        align-items: center;
        gap: 0.95rem;
        padding: 0.85rem 1.15rem;
        border-radius: 14px;
        background: linear-gradient(145deg, rgba(20, 25, 45, 0.82), rgba(15, 19, 34, 0.9));
        border: 1px solid rgba(148, 163, 184, 0.14);
        cursor: pointer;
        transition: all 0.2s ease;
      }
      .sd-lecture-card:hover {
        border-color: rgba(167, 139, 250, 0.42);
        background: linear-gradient(145deg, rgba(30, 37, 66, 0.92), rgba(40, 28, 62, 0.88));
        transform: translateY(-1px);
      }
      .sd-lecture-num {
        font-family: var(--font-display);
        font-size: 0.78rem;
        font-weight: 800;
        color: #a78bfa;
        min-width: 26px;
        text-align: center;
      }
      .sd-lecture-thumb {
        width: 82px;
        height: 48px;
        border-radius: 8px;
        object-fit: cover;
        background: rgba(12, 16, 28, 0.9);
        flex-shrink: 0;
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      .sd-lecture-details {
        flex: 1;
        min-width: 0;
      }
      .sd-lecture-title {
        font-size: 0.9rem;
        font-weight: 600;
        color: #f8fafc;
        margin-bottom: 0.24rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .sd-lecture-meta {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 0.42rem;
        font-size: 0.74rem;
        color: #94a3b8;
      }
      .sd-lecture-actions {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        flex-shrink: 0;
        flex-wrap: wrap;
      }
      .sd-lecture-btn {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        padding: 0.44rem 0.85rem;
        border-radius: 9px;
        border: 1px solid rgba(167, 139, 250, 0.4);
        background: linear-gradient(135deg, rgba(99, 102, 241, 0.28), rgba(168, 85, 247, 0.26));
        color: #fff;
        font-size: 0.74rem;
        font-weight: 700;
        cursor: pointer;
      }
      @media (max-width: 768px) {
        .sd-lecture-card {
          flex-wrap: wrap;
          gap: 0.7rem;
          padding: 0.85rem;
        }
        .sd-lecture-thumb {
          width: 68px;
          height: 42px;
        }
        .sd-lecture-title {
          white-space: normal;
        }
        .sd-lecture-actions {
          width: 100%;
          justify-content: flex-end;
        }
      }
    </style>
  </head>
  <body class="notes-theme-page">
    <!-- Subtle Atmospheric Backdrop -->
    <div id="nightingale-bg-container" class="nightingale-bg-container">
      <div class="bg-drift-wrapper">
        <img src="/nightingale.png?v=1790910745157" class="nightingale-bg-image" alt="" fetchpriority="high" decoding="async" draggable="false" oncontextmenu="return false;">
      </div>
    </div>

    <!-- Top Navigation Header -->
    <header id="app-header" class="app-header">
      <div class="header-logo" style="cursor: pointer;" onclick="window.location.href='/'">
        <span class="logo-text">NIGHTINGALE</span>
      </div>

      <nav class="header-nav-tabs">
        <div class="nav-tabs" style="margin: 0 !important;">
          <button id="tab-live" class="nav-tab">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="2"></circle>
              <path d="M16.24 7.76a6 6 0 0 1 0 8.49m-8.48-.01a6 6 0 0 1 0-8.49m11.31-2.83a10 10 0 0 1 0 14.14m-14.14 0a10 10 0 0 1 0-14.14"></path>
            </svg>
            <span>LIVE CLASSES</span>
          </button>

          <button id="tab-videos" class="nav-tab active">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="5 3 19 12 5 21 5 3"></polygon>
            </svg>
            <span>ALL VIDEOS</span>
          </button>

          <button id="tab-notes" class="nav-tab">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
              <line x1="16" y1="13" x2="8" y2="13"></line>
              <line x1="16" y1="17" x2="8" y2="17"></line>
            </svg>
            <span>NOTES &amp; PDFs</span>
          </button>

          <button id="tab-tests" class="nav-tab">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 11 12 14 22 4"></polyline>
              <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
            </svg>
            <span>PRACTICE TESTS</span>
          </button>
        </div>

        <button id="videos-refetch-btn" class="nav-tab-refresh-btn" title="Refresh Videos">
          <svg class="refresh-gyro-icon" viewBox="0 0 24 24" fill="none">
            <circle class="gyro-core" cx="12" cy="12" r="1.3" fill="currentColor" />
            <path class="gyro-arc-1" d="M12 4a8 8 0 0 1 8 8" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" />
            <path class="gyro-arc-2" d="M12 20a8 8 0 0 1-8-8" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" />
          </svg>
        </button>
      </nav>

      <div class="header-right-actions">
        <div class="batch-dropdown-container">
          <button id="header-batch-btn" class="nav-btn">
            <span id="current-batch-label">Red Sapphire (Hinglish)</span>
            <svg width="9" height="9" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" style="margin-left: 5px; display: inline-block; vertical-align: middle;"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5"></path></svg>
          </button>
          <div id="header-batch-dropdown" class="header-batch-dropdown hide"></div>
        </div>
      </div>
    </header>

    <main id="app" style="display: block !important; width: 100% !important; max-width: 100% !important; margin: 0 auto; padding-top: 1rem; box-sizing: border-box;">
      <div class="notes-page-container">

        <!-- Compact Header: "All Videos" + Stats + Search Box -->
        <section class="notes-hero-header" style="align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 1.5rem;">
          <div style="display: flex; align-items: center; gap: 0.85rem; flex-wrap: wrap;">
            <h1 class="notes-hero-title" style="margin: 0; font-size: 1.6rem;">Videos</h1>
            <div class="notes-hero-stats">
              <div class="notes-stat-pill">
                <strong id="stat-subjects">—</strong>
                <span>Subjects</span>
              </div>
              <div class="notes-stat-pill">
                <strong id="stat-lectures">—</strong>
                <span>Videos</span>
              </div>
              <div class="notes-stat-pill accent-pill">
                <span id="stat-batch-name">Red Sapphire (Hinglish)</span>
              </div>
            </div>
          </div>

          <div class="notes-search-wrapper" style="min-width: 240px; max-width: 440px; width: 100%;">
            <svg class="notes-search-icon" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z"/>
            </svg>
            <input
              type="text"
              id="videos-search-input"
              class="notes-search-input"
              placeholder="Search subjects, teachers, or lectures..."
              autocomplete="off"
            />
            <button id="videos-search-clear" class="notes-search-clear" title="Clear Search" aria-label="Clear search">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
            </button>
          </div>
        </section>

        <!-- VIEW 1: Subjects & Faculty Catalog -->
        <section id="subjects-catalog-view">
          <!-- Section Switcher: All Videos (Subjects + Teachers) vs Red Sapphire Hinglish Live Classes -->
          <div class="section-mode-tabs" style="margin-bottom: 1rem;">
            <button id="vid-tab-all" class="section-mode-tab active" data-mode="all">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
              <span>All Videos (Subjects &amp; Teachers)</span>
              <span id="vid-count-all" class="section-mode-count">1,523</span>
            </button>
            <button id="vid-tab-rb103" class="section-mode-tab" data-mode="rb103">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="2"/><path d="M16.24 7.76a6 6 0 0 1 0 8.49m-8.48-.01a6 6 0 0 1 0-8.49"/></svg>
              <span>Red Sapphire (Hinglish) — Past Classes</span>
              <span id="vid-count-rb103" class="section-mode-count">52</span>
            </button>
          </div>

          <!-- Category Filter Bar for All Videos -->
          <div id="vid-category-filters" style="display:flex; flex-wrap:wrap; gap:0.45rem; margin-bottom:1.15rem;"></div>

          <!-- Subjects Grid -->
          <div id="class-list-container" class="notes-subject-grid"></div>
        </section>

        <!-- VIEW 2: Compact Subject Lectures View -->
        <section id="subject-detail-view" class="subject-detail-view hide">
          <div class="notes-detail-compact-bar">
            <div class="compact-bar-left">
              <button id="btn-back-to-subjects" class="btn-notes-back">
                <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18"/></svg>
                <span>Back</span>
              </button>
            </div>

            <div class="compact-bar-center">
              <h2 id="subject-detail-title">Subject Title</h2>
              <span id="subject-detail-count" class="notes-detail-pill pill-count">0 Videos</span>
            </div>

            <div class="compact-bar-right">
              <span class="compact-teacher-pill">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                <span id="subject-detail-teacher">NNL Faculty</span>
              </span>
            </div>
          </div>

          <!-- Topic Filter Pills (Populated per subject) -->
          <div id="subject-topic-filters" style="display:none; flex-wrap:wrap; gap:0.45rem; margin-bottom:1rem; padding:0.75rem 0.95rem; background:rgba(12,15,28,0.62); border:1px solid rgba(167,139,250,0.16); border-radius:14px;"></div>

          <div class="sd-search-box">
            <svg class="sd-search-icon" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z"/></svg>
            <input type="text" id="subject-lecture-search" placeholder="Filter lectures by title, topic, or day..." />
          </div>

          <div id="subject-lectures-container" class="subject-lectures-container"></div>
        </section>

      </div>
    </main>

    <!-- RECORDING VIEWER -->
    <div id="recording-viewer" class="recording-viewer hide">
      <div class="recording-viewer-header">
        <div class="recording-viewer-meta">
          <span class="cyber-hero-badge" style="margin-bottom:0.25rem;display:inline-block;">// RECORDED LECTURE</span>
          <h2 id="recording-viewer-title" style="font-family:var(--font-display);font-size:1.05rem;font-weight:700;background:var(--grad-text);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin:0;"></h2>
          <span id="recording-viewer-instructor" style="font-size:0.8rem;color:var(--text-secondary);"></span>
        </div>
        <button id="close-recording-viewer" class="btn-close-recording" title="Back">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18"/></svg>
          <span>Back</span>
        </button>
      </div>
      <div class="recording-viewer-body">
        <video id="recording-video" class="recording-video-player hide" controls preload="metadata" playsinline>
          Your browser does not support video playback.
        </video>
        <div id="recording-no-url" class="recording-no-url hide">
          <div style="width:56px;height:56px;margin:0 auto 1rem;border-radius:16px;background:rgba(167,139,250,0.12);border:1px solid rgba(167,139,250,0.35);display:flex;align-items:center;justify-content:center;color:#c4b5fd;">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16 13 5.223 3.482a.5.5 0 0 0 .777-.416V7.87a.5.5 0 0 0-.752-.432L16 10.5"/><rect x="2" y="6" width="14" height="12" rx="2"/></svg>
          </div>
          <h3 id="recording-error-title" style="font-family:var(--font-display);font-size:1rem;margin-bottom:0.5rem;">Playback Preparation</h3>
          <p id="recording-error-desc" style="color:var(--text-secondary);font-size:0.85rem;">Securing lecture stream...</p>
          <button id="recording-retry-btn" class="btn" style="margin-top:1rem;padding:0.6rem 1.4rem;background:linear-gradient(135deg,#6366f1,#ec4899);color:#fff;font-weight:700;border:none;border-radius:10px;cursor:pointer;">Retry Playback</button>
        </div>
      </div>
      <div class="recording-viewer-disclaimer" style="padding:0.65rem 1.25rem;background:rgba(0,0,0,0.55);border-top:1px solid rgba(255,255,255,0.06);font-size:0.72rem;color:var(--text-secondary);display:flex;align-items:center;gap:0.5rem;justify-content:center;text-align:center;">
        <span>High-definition encrypted lecture playback via VdoCipher.</span>
      </div>
    </div>

    <!-- In-App PDF Reader Modal (Lecture Notes) -->
    <div id="pdf-modal" class="pdf-modal-overlay hide">
      <div class="pdf-modal-container">
        <div class="pdf-modal-header">
          <div class="pdf-modal-title" id="pdf-modal-title">Lecture Notes PDF</div>
          <div class="pdf-modal-actions">
            <a id="pdf-modal-download-btn" href="#" target="_blank" class="btn-note-download" style="padding: 0.4rem 0.8rem; font-size: 0.7rem;">
              <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3"/></svg>
              <span>Open Full PDF</span>
            </a>
            <button id="pdf-modal-close-btn" class="btn-close-quiz" title="Close Preview" style="width: 34px; height: 34px;" aria-label="Close preview">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
            </button>
          </div>
        </div>
        <div class="pdf-modal-body">
          <iframe id="pdf-modal-iframe" class="pdf-iframe" src=""></iframe>
        </div>
      </div>
    </div>

    <!-- Floating Settings Widget (with OTA Update Hook) -->
    <div class="cyber-tweaks-widget">
      <div class="tweaks-panel">
        <div class="tweaks-section">
          <div class="tweaks-label">Student Profile</div>
          <div style="display:flex;align-items:center;gap:0.6rem;padding:0.35rem 0;">
            <span id="user-avatar" style="width:28px;height:28px;border-radius:8px;background:rgba(167,139,250,0.2);border:1px solid rgba(167,139,250,0.35);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:0.78rem;color:#fff;">N</span>
            <span id="user-phone" style="font-size:0.78rem;color:#e2e8f0;font-weight:600;">Student</span>
          </div>
          <button id="logout-btn" class="settings-logout-btn">Logout Account</button>
        </div>
      </div>
      <button id="tweak-panel-toggle-btn" class="tweaks-toggle-btn" title="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" width="18" height="18"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>

    <script type="module" src="/src/all-videos.js"></script>
  </body>
</html>
