<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Nightingale Recorded Lectures Library - Access all past video lectures grouped by subject." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/style.css" />
    <title>Nightingale Classroom - Recorded Lectures Library</title>
    <style>
      .container {
        display: flex !important;
        flex-direction: column !important;
        align-items: stretch !important;
        gap: 2rem !important;
        max-width: 100% !important;
        padding: 0 !important;
        margin: 0 !important;
      }
      .recordings-browser-container {
        position: fixed;
        top: 90px;
        left: 20px;
        width: 330px;
        background: rgba(10, 11, 18, 0.85);
        border: 1px solid rgba(0, 243, 208, 0.2);
        border-radius: 14px;
        overflow: hidden;
        z-index: 1000;
        backdrop-filter: blur(15px);
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .recordings-browser-container.expanded {
        width: 520px;
      }
      .recordings-browser-header {
        padding: 0.8rem 1.2rem;
        background: rgba(255, 255, 255, 0.02);
        border-bottom: 1px solid rgba(0, 243, 208, 0.15);
        display: flex;
        justify-content: space-between;
        align-items: center;
        cursor: pointer;
        user-select: none;
        transition: background 0.2s ease;
      }
      .recordings-browser-header:hover {
        background: rgba(255, 255, 255, 0.04);
      }
      .recordings-browser-title {
        font-family: var(--font-display);
        font-size: 0.82rem;
        font-weight: 800;
        color: #00f3d0;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      .recordings-browser-chevron {
        transition: transform 0.3s ease;
        color: var(--text-secondary);
      }
      .recordings-browser-container.expanded .recordings-browser-chevron {
        transform: rotate(180deg);
      }
      .recordings-browser-body {
        max-height: 0;
        overflow-y: auto;
        transition: max-height 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .recordings-browser-container.expanded .recordings-browser-body {
        max-height: 520px;
        padding: 0.75rem;
      }
      /* Override row styles for list nesting */
      .recordings-browser-body .recording-row {
        margin-bottom: 0.5rem;
        background: rgba(255, 255, 255, 0.02);
        border: 1px solid rgba(255, 255, 255, 0.05);
      }
      .recordings-browser-body .recording-row:hover {
        background: rgba(255, 255, 255, 0.04);
        border-color: rgba(0, 243, 208, 0.2);
      }
    </style>
  </head>
  <body>
    <!-- Nightingale Static Background Image -->
    <div id="nightingale-bg-container" class="nightingale-bg-container">
      <div class="bg-drift-wrapper">
        <img src="/nightingale.jpg" class="nightingale-bg-image" alt="" fetchpriority="high" decoding="async" draggable="false" oncontextmenu="return false;">
      </div>
    </div>

    <!-- App Header -->
    <header class="app-header">
      <div class="header-logo">
        <div class="header-logo-icon">
          <svg width="40" height="24" viewBox="0 0 40 24" fill="none" stroke="currentColor" class="heartbeat-svg">
            <path d="M0 12h14l3-8 4 16 3-11 2 3h14" class="heartbeat-track" />
            <path d="M0 12h14l3-8 4 16 3-11 2 3h14" class="heartbeat-pulse" />
          </svg>
        </div>
        <span class="logo-text">NIGHTINGALE</span>
      </div>
      
      <div class="header-nav">
        <button id="btn-back-dashboard" class="nav-btn" style="color: #fff; border-color: rgba(255, 255, 255, 0.15); font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; display: flex; align-items: center; gap: 0.4rem;">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18"/></svg>
          <span>Back to Dashboard</span>
        </button>
      </div>
    </header>

    <!-- Main Content -->
    <main id="app">
      <!-- Compact sidebar container in top-left -->
      <div id="library-widget-container" class="recordings-browser-container">
        <div id="library-widget-header" class="recordings-browser-header">
          <div class="recordings-browser-title">
            <span>📚 C+ Plan Lectures</span>
            <span id="lectures-count-badge" style="font-size: 0.65rem; background: rgba(0, 243, 208, 0.15); color: #00f3d0; padding: 0.1rem 0.35rem; border-radius: 6px; font-weight: 700;">Loading...</span>
          </div>
          <svg class="recordings-browser-chevron" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5"/>
          </svg>
        </div>
        <div class="recordings-browser-body">
          <div id="class-list-container" class="recordings-browser">
            <!-- Dynamically populated via JS -->
          </div>
        </div>
      </div>
    </main>

    <!-- RECORDING VIEWER (Hidden by default) -->
    <div id="recording-viewer" class="recording-viewer hide">
      <div class="recording-viewer-header">
        <div class="recording-viewer-meta">
          <span class="cyber-hero-badge" style="margin-bottom: 0.25rem; display: inline-block;">// RECORDED LECTURE</span>
          <h2 id="recording-viewer-title" style="font-family: var(--font-display); font-size: 1.1rem; font-weight: 700; background: var(--grad-text); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin: 0;"></h2>
          <span id="recording-viewer-instructor" style="font-size: 0.8rem; color: var(--text-secondary);"></span>
        </div>
        <button id="close-recording-viewer" class="btn-close-recording" title="Back to Dashboard">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18"/></svg>
          <span>Back</span>
        </button>
      </div>
      <div class="recording-viewer-body">
        <video id="recording-video" class="recording-video-player" controls preload="metadata" playsinline>
          Your browser does not support video playback.
        </video>
        <div id="recording-no-url" class="recording-no-url hide">
          <div style="font-size: 3rem; margin-bottom: 1rem;">📹</div>
          <h3 style="font-family: var(--font-display); font-size: 1rem; margin-bottom: 0.5rem;">Recording Not Available Online</h3>
          <p style="color: var(--text-secondary); font-size: 0.85rem;">This recording is available on the NNL ONE mobile app.</p>
        </div>
      </div>
      <div class="recording-viewer-disclaimer" style="padding: 0.75rem 1.5rem; background: rgba(0,0,0,0.5); border-top: 1px solid rgba(255,255,255,0.05); font-size: 0.72rem; color: var(--text-secondary); display: flex; align-items: center; gap: 0.5rem; justify-content: center; text-align: center;">
        <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
        <span>Note: Premium lectures are protected. If you see Error 2127 or compatibility issues, please watch them on the NNL ONE Mobile App.</span>
      </div>
    </div>

    <!-- App Logic script -->
    <script type="module" src="/src/all-videos.js"></script>
  </body>
</html>
