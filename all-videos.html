<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <script>
      (function(){
        try {
          var t = localStorage.getItem('nnl_app_theme');
          if (!t) {
            t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', t);
          if (localStorage.getItem('nnl_access_token')) {
            var s = document.createElement('style');
            s.textContent = '#app-preloader{display:none!important;}';
            document.head.appendChild(s);
          }
        } catch(e) {}
      })();
    </script>
    <meta name="description" content="Nightingale Recorded Video Lectures — All Subjects, Faculty &amp; Red Sapphire Live Class Videos." />
    <title>Nightingale — All Videos</title>
    <style>
      .sd-search-box {
        position: relative;
        margin-bottom: 1.25rem;
      }
      .sd-search-box input {
        width: 100%;
        padding: 0.85rem 1.2rem 0.85rem 2.8rem;
        border-radius: 14px;
        border: 1px solid rgba(167, 139, 250, 0.22);
        background: linear-gradient(135deg, rgba(22, 28, 50, 0.82), rgba(28, 22, 46, 0.78));
        color: #fff;
        font-family: var(--font-body);
        font-size: 0.88rem;
        outline: none;
        box-sizing: border-box;
      }
      .sd-search-box input:focus {
        border-color: rgba(167, 139, 250, 0.55);
      }
      .sd-search-icon {
        position: absolute;
        left: 0.95rem;
        top: 50%;
        transform: translateY(-50%);
        color: #94a3b8;
        pointer-events: none;
      }
      .subject-lectures-container {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .notes-detail-compact-bar {
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding: 7px 11px;
        margin-bottom: 9px;
        border-radius: 12px;
        background: linear-gradient(135deg, rgba(28, 22, 52, 0.88), rgba(18, 14, 34, 0.94));
        border: 1px solid rgba(167, 139, 250, 0.18);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        box-sizing: border-box;
      }
      [data-theme="light"] .notes-detail-compact-bar {
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.96), rgba(244, 238, 255, 0.94));
        border: 1px solid rgba(108, 79, 214, 0.18);
      }
      .subject-detail-top-line {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        min-width: 0;
      }
      .subject-detail-top-line .btn-notes-back {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 3px 8px;
        border-radius: 7px;
        background: rgba(142, 116, 229, 0.16);
        border: 1px solid rgba(167, 139, 250, 0.28);
        color: var(--text-primary);
        font-size: 0.74rem;
        font-weight: 700;
        cursor: pointer;
        flex-shrink: 0;
      }
      .subject-detail-top-line .subject-detail-title {
        margin: 0;
        font-size: 1.05rem;
        font-weight: 800;
        color: var(--text-primary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        flex: 1 1 auto;
        min-width: 0;
      }
      .subject-detail-sub-line {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        width: 100%;
      }
      .subject-detail-sub-line .subject-detail-count {
        font-size: 0.72rem;
        font-weight: 700;
        color: var(--accent);
      }
      .subject-detail-sub-line .subject-detail-teacher-box {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 0.72rem;
        font-weight: 600;
        color: var(--text-secondary);
      }
      .subject-detail-sub-line .subject-detail-teacher-box svg {
        stroke: var(--accent);
        width: 13px;
        height: 13px;
        flex-shrink: 0;
      }
      .subject-detail-sub-line .subject-detail-teacher {
        color: var(--text-primary);
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* Lecture Cards (Comfortable Height ~68px, Generous 16:9 Thumbnail, Clear Subtext) */
      .sd-lecture-card {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 12px;
        min-height: 68px;
        border-radius: 12px;
        background: linear-gradient(135deg, rgba(24, 19, 44, 0.82), rgba(16, 12, 32, 0.9));
        border: 1px solid rgba(167, 139, 250, 0.16);
        cursor: pointer;
        transition: transform 0.16s ease, border-color 0.16s ease, background 0.16s ease;
        box-sizing: border-box;
      }
      [data-theme="light"] .sd-lecture-card {
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.95), rgba(245, 240, 255, 0.92));
        border: 1px solid rgba(108, 79, 214, 0.16);
      }
      .sd-lecture-card:hover {
        border-color: rgba(167, 139, 250, 0.42);
        transform: translateY(-1px);
      }
      .sd-lecture-card:active {
        transform: scale(0.99);
      }
      .sd-lecture-num {
        font-family: var(--font-display, monospace);
        font-size: 0.78rem;
        font-weight: 800;
        color: var(--accent);
        min-width: 22px;
        text-align: center;
        flex-shrink: 0;
      }
      .sd-lecture-thumb-wrap {
        width: 72px;
        height: 44px;
        border-radius: 8px;
        overflow: hidden;
        position: relative;
        flex-shrink: 0;
        background: rgba(10, 8, 20, 0.85);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      .sd-lecture-thumb {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .sd-thumb-play-overlay {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.32);
        color: #fff;
        opacity: 0.85;
        pointer-events: none;
      }
      .sd-lecture-body {
        flex: 1 1 auto;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 4px;
        justify-content: center;
      }
      .sd-lecture-top-line {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 6px;
        width: 100%;
      }
      .sd-lecture-title {
        font-size: 0.86rem;
        font-weight: 700;
        color: var(--text-primary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        flex: 1 1 auto;
        min-width: 0;
      }
      .sd-lecture-date {
        font-size: 0.69rem;
        font-weight: 600;
        color: var(--text-muted);
        white-space: nowrap;
        flex-shrink: 0;
      }
      .sd-lecture-sub-line {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
        width: 100%;
      }
      .sd-lecture-meta-left {
        display: flex;
        align-items: center;
        gap: 5px;
        font-size: 0.72rem;
        font-weight: 600;
        color: var(--text-secondary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .sd-lecture-actions {
        display: flex;
        align-items: center;
        gap: 5px;
        flex-shrink: 0;
      }
      .sd-mini-pill {
        display: inline-flex;
        align-items: center;
        gap: 3px;
        padding: 3px 7px;
        border-radius: 6px;
        font-size: 0.68rem;
        font-weight: 700;
        line-height: 1;
        cursor: pointer;
        background: rgba(142, 116, 229, 0.14);
        border: 1px solid rgba(167, 139, 250, 0.26);
        color: var(--text-primary);
        transition: all 0.15s ease;
        white-space: nowrap;
      }
      .sd-mini-pill:hover {
        background: rgba(142, 116, 229, 0.24);
        border-color: rgba(167, 139, 250, 0.45);
      }
      .sd-mini-pill.is-saved,
      .sd-mini-pill.saved {
        background: rgba(52, 211, 153, 0.18);
        border-color: rgba(52, 211, 153, 0.45);
        color: #34d399;
      }
    </style>
  </head>
  <body class="notes-theme-page">
    <!-- Ambient Single Unified Background Layer -->
    <div id="apk-ambient-bg"></div>

    <!-- Top Navigation Header -->
    <header id="app-header" class="app-header">
      <div class="header-logo" style="cursor: pointer;" onclick="window.location.href='/'">
        <div class="apk-logo-badge" style="width:44px;height:44px;border-radius:14px;background:linear-gradient(145deg, #4E329A 0%, #6F4FC4 55%, #957AE9 100%);display:inline-flex;align-items:center;justify-content:center;box-shadow:0 8px 22px rgba(91,62,168,0.28);">
          <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" style="width:24px;height:24px;">
            <path d="M18 45V20c7 0 11 5.5 14 11.5C35 37.5 39 43 46 43V18" stroke="#FFFFFF" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="46" cy="11.5" r="3.2" fill="#E9DFFF"/>
          </svg>
        </div>
      </div>

      <nav class="header-nav-tabs">
        <div class="nav-tabs" style="margin: 0 !important;">
          <button id="tab-live" class="nav-tab" title="Home" onclick="window.location.href='/'">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
              <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
            <span>HOME</span>
          </button>

          <button id="tab-videos" class="nav-tab active">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="5 3 19 12 5 21 5 3"></polygon>
            </svg>
            <span>ALL VIDEOS</span>
          </button>

          <button id="tab-notes" class="nav-tab">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
              <line x1="16" y1="13" x2="8" y2="13"></line>
              <line x1="16" y1="17" x2="8" y2="17"></line>
            </svg>
            <span>NOTES &amp; PDFs</span>
          </button>

          <button id="tab-tests" class="nav-tab">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 11 12 14 22 4"></polyline>
              <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
            </svg>
            <span>TESTS</span>
          </button>

          <button id="tab-saved" class="nav-tab" title="Saved Content &amp; Offline">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
            </svg>
            <span>SAVED</span>
          </button>
        </div>

        <button id="videos-refetch-btn" class="nav-tab-refresh-btn" title="Refresh Videos">
          <svg class="refresh-gyro-icon" viewBox="0 0 24 24" fill="none">
            <circle class="gyro-core" cx="12" cy="12" r="1.3" fill="currentColor" />
            <path class="gyro-arc-1" d="M12 4a8 8 0 0 1 8 8" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" />
            <path class="gyro-arc-2" d="M12 20a8 8 0 0 1-8-8" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" />
          </svg>
        </button>
      </nav>

      <div class="header-right-actions">
        <div class="batch-dropdown-container">
          <button id="header-batch-btn" class="nav-btn">
            <span id="current-batch-label">Red Sapphire (Hinglish)</span>
            <svg width="9" height="9" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" style="margin-left: 5px; display: inline-block; vertical-align: middle;"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5"></path></svg>
          </button>
          <div id="header-batch-dropdown" class="header-batch-dropdown hide"></div>
        </div>
      </div>
    </header>

    <main id="app">
      <div class="notes-page-container">

        <!-- Compact Header: "Videos" + Search Box Directly Beside Title -->
        <section class="notes-hero-header">
          <div class="notes-hero-bar">
            <h1 class="notes-hero-title">Videos</h1>
            <div id="videos-search-box" class="notes-search-wrapper">
              <svg class="notes-search-icon" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z"/>
              </svg>
              <input
                type="text"
                id="videos-search-input"
                class="notes-search-input"
                placeholder="Search subjects or teachers..."
                autocomplete="off"
              />
              <button id="videos-search-clear" class="notes-search-clear" title="Clear Search" aria-label="Clear search">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
              </button>
            </div>
          </div>
        </section>

        <!-- VIEW 1: Subjects & Faculty Catalog -->
        <section id="subjects-catalog-view">
          <!-- Section Switcher: All Videos vs Red Sapphire Live Classes -->
          <div class="section-mode-tabs" style="margin-bottom: 1rem;">
            <button id="vid-tab-all" class="section-mode-tab active" data-mode="all">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
              <span>All Lectures</span>
              <span id="vid-count-all" class="section-mode-count">1,523</span>
            </button>
            <button id="vid-tab-rb103" class="section-mode-tab" data-mode="rb103">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="2"/><path d="M16.24 7.76a6 6 0 0 1 0 8.49m-8.48-.01a6 6 0 0 1 0-8.49"/></svg>
              <span>Red Sapphire</span>
              <span id="vid-count-rb103" class="section-mode-count">52</span>
            </button>
          </div>

          <!-- Category Filter Bar for All Videos (Hidden per user request, All Subjects shown by default) -->
          <div id="vid-category-filters" style="display:none !important;"></div>

          <!-- Subjects Grid -->
          <div id="class-list-container" class="notes-subject-grid"></div>
        </section>

        <!-- VIEW 2: Compact Subject Lectures View -->
        <section id="subject-detail-view" class="subject-detail-view hide">
          <!-- Subject Detail Header: Row 1 Back & Subject Title; Row 2 Left Video Count, Right Person Icon & Teacher Name -->
          <div class="notes-detail-compact-bar">
            <div class="subject-detail-top-line">
              <button id="btn-back-to-subjects" class="btn-notes-back" type="button" aria-label="Go Back">
                <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18"/></svg>
                <span>Back</span>
              </button>
              <h2 id="subject-detail-title" class="subject-detail-title">Subject Title</h2>
            </div>
            <div class="subject-detail-sub-line">
              <span id="subject-detail-count" class="subject-detail-count">0 Videos</span>
              <div class="subject-detail-teacher-box">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                <span id="subject-detail-teacher" class="subject-detail-teacher">NNL Faculty</span>
              </div>
            </div>
          </div>

          <!-- Topic Filter Pills (Populated per subject) -->
          <div id="subject-topic-filters" style="display:none; flex-wrap:wrap; gap:0.45rem; margin-bottom:1rem; padding:0.75rem 0.95rem; background:rgba(12,15,28,0.62); border:1px solid rgba(167,139,250,0.16); border-radius:14px;"></div>

          <div class="sd-search-box">
            <svg class="sd-search-icon" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z"/></svg>
            <input type="text" id="subject-lecture-search" placeholder="Filter lectures by title, topic, or day..." />
          </div>

          <div id="subject-lectures-container" class="subject-lectures-container"></div>
        </section>

      </div>
    </main>

    <!-- RECORDING VIEWER -->
    <div id="recording-viewer" class="recording-viewer hide">
      <div class="recording-viewer-header">
        <div class="recording-viewer-meta">
          <h2 id="recording-viewer-title" style="font-family:var(--font-display);font-size:1.05rem;font-weight:700;color:var(--text-primary);margin:0;"></h2>
          <span id="recording-viewer-instructor" style="font-size:0.8rem;color:var(--text-secondary);"></span>
        </div>
        <button id="close-recording-viewer" class="btn-close-recording" title="Close">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="recording-viewer-body">
        <video id="recording-video" class="recording-video-player hide" controls preload="metadata" playsinline>
          Your browser does not support video playback.
        </video>
        <div id="recording-no-url" class="recording-no-url hide">
          <div style="width:48px;height:48px;margin:0 auto 1rem;border-radius:14px;background:rgba(167,139,250,0.12);border:1px solid rgba(167,139,250,0.35);display:flex;align-items:center;justify-content:center;color:#c4b5fd;">
            <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
          </div>
          <h3 id="recording-error-title" style="font-family:var(--font-display);font-size:1rem;margin-bottom:0.5rem;">Playback</h3>
          <p id="recording-error-desc" style="color:var(--text-secondary);font-size:0.85rem;">Loading lecture...</p>
          <button id="recording-retry-btn" class="btn" style="margin-top:1rem;padding:0.6rem 1.4rem;background:linear-gradient(135deg,#6366f1,#ec4899);color:#fff;font-weight:700;border:none;border-radius:10px;cursor:pointer;">Retry</button>
        </div>
      </div>

      <!-- Portrait Mode Notes PDF Bar -->
      <div id="recording-portrait-notes" class="recording-portrait-notes hide">
        <div class="rpn-meta-wrap">
          <div class="rpn-icon-box">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline stroke-linecap="round" stroke-linejoin="round" points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><line x1="10" y1="9" x2="8" y2="9"/></svg>
          </div>
          <div class="rpn-text-wrap">
            <span class="rpn-badge">LECTURE NOTES PDF</span>
            <h4 id="rpn-title" class="rpn-title">Handwritten Notes</h4>
          </div>
        </div>
        <div class="rpn-actions">
          <button id="rpn-view-btn" class="rpn-btn rpn-view-btn" type="button">
            <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.964-7.178z"/><circle cx="12" cy="12" r="3" stroke-width="2.2"/></svg>
            <span>View PDF</span>
          </button>
          <a id="rpn-download-btn" href="#" target="_blank" rel="noopener noreferrer" class="rpn-btn rpn-dl-btn" download>
            <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3"/></svg>
            <span>Download</span>
          </a>
        </div>
      </div>
    </div>

    <!-- In-App PDF Reader Modal (Lecture Notes) -->
    <div id="pdf-modal" class="pdf-modal-overlay hide">
      <div class="pdf-modal-container">
        <div class="pdf-modal-header">
          <div class="pdf-modal-title" id="pdf-modal-title">Lecture Notes PDF</div>
          <div class="pdf-modal-actions">
            <a id="pdf-modal-download-btn" href="#" target="_blank" class="btn-note-download" style="padding: 0.4rem 0.8rem; font-size: 0.7rem;">
