<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Nightingale C+ Plan - Access all recorded lectures grouped by subject." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/style.css" />
    <title>Nightingale — C+ Plan Lectures</title>
    <style>
      /* ── Full-page override: break out of the centred auth layout ── */
      body { overflow-x: hidden; }

      * { scrollbar-width: thin; scrollbar-color: rgba(0,243,208,0.18) transparent; }
      *::-webkit-scrollbar { width: 5px; }
      *::-webkit-scrollbar-track { background: transparent; }
      *::-webkit-scrollbar-thumb { background: rgba(0,243,208,0.18); border-radius: 4px; }
      *::-webkit-scrollbar-thumb:hover { background: rgba(0,243,208,0.35); }

      #app {
        display: block !important;
        align-items: unset !important;
        justify-content: unset !important;
        width: 100% !important;
        max-width: 100% !important;
        margin-top: 74px !important;
        padding: 2.5rem 3rem 5rem !important;
        box-sizing: border-box !important;
      }

      /* ── Page header ── */
      .cp-header {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 1.5rem;
        margin-bottom: 2.5rem;
      }
      .cp-badge {
        font-family: var(--font-display);
        font-size: 0.7rem;
        letter-spacing: 0.18em;
        color: #00f3d0;
        text-transform: uppercase;
        margin-bottom: 0.5rem;
      }
      .cp-title {
        font-family: var(--font-display);
        font-size: clamp(2rem, 4vw, 3rem);
        font-weight: 900;
        background: linear-gradient(135deg, #fff 20%, #00f3d0 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin: 0;
        line-height: 1.05;
      }
      .cp-stats {
        display: flex;
        gap: 2rem;
        align-items: flex-end;
      }
      .cp-stat {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.15rem;
      }
      .cp-stat-num {
        font-family: var(--font-display);
        font-size: 2rem;
        font-weight: 900;
        color: #00f3d0;
        line-height: 1;
      }
      .cp-stat-lbl {
        font-family: var(--font-display);
        font-size: 0.6rem;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: var(--text-secondary);
      }

      /* ── Subjects grid ── */
      .subjects-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 1.25rem;
        width: 100%;
        align-items: start;
      }
      @media (max-width: 1100px) { .subjects-grid { grid-template-columns: repeat(2, 1fr); } }
      @media (max-width: 680px)  { .subjects-grid { grid-template-columns: 1fr; } }

      /* ── Subject card ── */
      .subject-card {
        background: rgba(8, 10, 20, 0.72);
        border: 1px solid rgba(255,255,255,0.07);
        border-radius: 20px;
        overflow: hidden;
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        transition: border-color 0.25s ease, box-shadow 0.25s ease, transform 0.2s ease;
        display: flex;
        flex-direction: column;
      }
      .subject-card:hover {
        border-color: rgba(0,243,208,0.2);
        box-shadow: 0 12px 40px rgba(0,0,0,0.45);
        transform: translateY(-2px);
      }
      .subject-card.open {
        border-color: rgba(0,243,208,0.2);
      }

      /* ── Card header ── */
      .sc-header {
        display: flex;
        align-items: center;
        gap: 1rem;
        padding: 1.2rem 1.4rem;
        cursor: pointer;
        user-select: none;
        transition: background 0.2s ease;
        flex-shrink: 0;
      }
      .sc-header:hover { background: rgba(255,255,255,0.025); }

      .sc-icon {
        width: 46px;
        height: 46px;
        border-radius: 13px;
        background: linear-gradient(135deg, rgba(0,243,208,0.12), rgba(0,180,155,0.06));
        border: 1px solid rgba(0,243,208,0.18);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        color: rgba(0,243,208,0.75);
      }
      .sc-meta { flex: 1; min-width: 0; }
      .sc-name {
        font-family: var(--font-display);
        font-size: 0.92rem;
        font-weight: 700;
        color: #fff;
        letter-spacing: 0.01em;
        margin-bottom: 0.2rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .sc-count {
        font-size: 0.72rem;
        color: var(--text-secondary);
      }
      .sc-chevron {
        color: var(--text-secondary);
        transition: transform 0.3s ease, color 0.2s ease;
        flex-shrink: 0;
      }
      .subject-card.open .sc-chevron {
        transform: rotate(180deg);
        color: #00f3d0;
      }

      /* ── Lecture list ── */
      .lec-list {
        max-height: 0;
        overflow: hidden;
        transition: max-height 0.4s cubic-bezier(0.16,1,0.3,1);
        border-top: 1px solid transparent;
      }
      .subject-card.open .lec-list {
        max-height: 480px;
        overflow-y: auto;
        border-top-color: rgba(255,255,255,0.05);
      }
      .lec-list-inner {
        padding: 0.6rem 0.85rem 0.85rem;
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
      }

      /* ── Lecture row ── */
      .lec-row {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 0.65rem 0.8rem;
        border-radius: 11px;
        background: rgba(255,255,255,0.02);
        border: 1px solid rgba(255,255,255,0.04);
        cursor: pointer;
        transition: background 0.18s ease, border-color 0.18s ease;
      }
      .lec-row:hover {
        background: rgba(0,243,208,0.06);
        border-color: rgba(0,243,208,0.18);
      }
      .lec-num {
        font-family: var(--font-display);
        font-size: 0.62rem;
        font-weight: 700;
        color: rgba(0,243,208,0.6);
        min-width: 20px;
        text-align: center;
      }
      .lec-info { flex: 1; min-width: 0; }
      .lec-title {
        font-size: 0.8rem;
        font-weight: 600;
        color: rgba(255,255,255,0.9);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        margin-bottom: 0.12rem;
      }
      .lec-meta {
        font-size: 0.67rem;
        color: var(--text-secondary);
        display: flex;
        gap: 0.35rem;
        align-items: center;
      }
      .lec-play {
        width: 30px;
        height: 30px;
        border-radius: 8px;
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.08);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.18s ease;
        flex-shrink: 0;
        color: rgba(255,255,255,0.55);
      }
      .lec-play:hover {
        background: rgba(0,243,208,0.14);
        border-color: rgba(0,243,208,0.4);
        color: #00f3d0;
      }

      /* Loading state */
      .cp-loading {
        grid-column: 1 / -1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 6rem 2rem;
        gap: 1rem;
      }
    </style>
  </head>
  <body>
    <div id="nightingale-bg-container" class="nightingale-bg-container">
      <div class="bg-drift-wrapper">
        <img src="/nightingale.jpg" class="nightingale-bg-image" alt="" fetchpriority="high" decoding="async" draggable="false" oncontextmenu="return false;">
      </div>
    </div>

    <header class="app-header">
      <div class="header-logo">
        <div class="header-logo-icon">
          <svg width="40" height="24" viewBox="0 0 40 24" fill="none" stroke="currentColor" class="heartbeat-svg">
            <path d="M0 12h14l3-8 4 16 3-11 2 3h14" class="heartbeat-track" />
            <path d="M0 12h14l3-8 4 16 3-11 2 3h14" class="heartbeat-pulse" />
          </svg>
        </div>
        <span class="logo-text">NIGHTINGALE</span>
      </div>
      <div class="header-nav">
        <button id="btn-back-dashboard" class="nav-btn" style="color:#fff;border-color:rgba(255,255,255,0.15);font-size:0.72rem;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;display:flex;align-items:center;gap:0.4rem;">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18"/></svg>
          <span>Dashboard</span>
        </button>
      </div>
    </header>

    <main id="app">
      <!-- Page Header -->
      <div class="cp-header">
        <div>
          <div class="cp-badge">// C+ Subscription Plan</div>
          <h1 class="cp-title">Recorded Lectures</h1>
        </div>
        <div class="cp-stats" id="cp-stats" style="display:none;">
          <div class="cp-stat">
            <span class="cp-stat-num" id="stat-subjects">—</span>
            <span class="cp-stat-lbl">Subjects</span>
          </div>
          <div class="cp-stat">
            <span class="cp-stat-num" id="stat-lectures">—</span>
            <span class="cp-stat-lbl">Lectures</span>
          </div>
        </div>
      </div>

      <!-- Subjects Grid -->
      <div id="class-list-container" class="subjects-grid">
        <div class="cp-loading">
          <div class="spinner"></div>
          <p style="color:var(--text-secondary);font-family:var(--font-display);font-size:0.75rem;text-transform:uppercase;letter-spacing:0.08em;margin:0;">Loading C+ Lectures...</p>
        </div>
      </div>
    </main>

    <!-- RECORDING VIEWER -->
    <div id="recording-viewer" class="recording-viewer hide">
      <div class="recording-viewer-header">
        <div class="recording-viewer-meta">
          <span class="cyber-hero-badge" style="margin-bottom:0.25rem;display:inline-block;">// RECORDED LECTURE</span>
          <h2 id="recording-viewer-title" style="font-family:var(--font-display);font-size:1.1rem;font-weight:700;background:var(--grad-text);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin:0;"></h2>
          <span id="recording-viewer-instructor" style="font-size:0.8rem;color:var(--text-secondary);"></span>
        </div>
        <button id="close-recording-viewer" class="btn-close-recording" title="Back">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18"/></svg>
          <span>Back</span>
        </button>
      </div>
      <div class="recording-viewer-body">
        <video id="recording-video" class="recording-video-player" controls preload="metadata" playsinline>
          Your browser does not support video playback.
        </video>
        <div id="recording-no-url" class="recording-no-url hide">
          <div style="font-size:3rem;margin-bottom:1rem;">📹</div>
          <h3 style="font-family:var(--font-display);font-size:1rem;margin-bottom:0.5rem;">Recording Not Available Online</h3>
          <p style="color:var(--text-secondary);font-size:0.85rem;">This recording is available on the NNL ONE mobile app.</p>
        </div>
      </div>
      <div class="recording-viewer-disclaimer" style="padding:0.75rem 1.5rem;background:rgba(0,0,0,0.5);border-top:1px solid rgba(255,255,255,0.05);font-size:0.72rem;color:var(--text-secondary);display:flex;align-items:center;gap:0.5rem;justify-content:center;text-align:center;">
        <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
        <span>Premium lectures are DRM protected. If playback fails, use the NNL ONE Mobile App.</span>
      </div>
    </div>

    <script type="module" src="/src/all-videos.js"></script>
  </body>
</html>
