<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3rd Year Question Papers &amp; Repeating Topics — Nightingale</title>
    <script>
      (function(){
        try {
          var t = localStorage.getItem('nnl_app_theme');
          if (!t) {
            t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', t);
          if (window.AndroidBridge || window.__NNL_ANDROID_APK__ || (navigator.userAgent && /NightingaleAndroid/i.test(navigator.userAgent))) {
            document.documentElement.classList.add('is-native-android-apk');
          }
        } catch(e) {}
      })();
    </script>
    <script src="/vendor/pdfjs/pdf.min.js"></script>
    <style>
      html, body {
        background-color: #09080e !important;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent !important;
        -webkit-touch-callout: none !important;
      }
      html[data-theme="light"], html[data-theme="light"] body {
        background-color: #f6f4fa !important;
      }
      #apk-ambient-bg {
        position: fixed !important;
        inset: 0 !important;
        width: 100vw !important;
        height: 100vh !important;
        background-color: #09080e !important;
        background-image: url('/bg-app-wallpaper.jpg') !important;
        background-attachment: fixed !important;
        background-size: cover !important;
        background-position: center center !important;
        background-repeat: no-repeat !important;
        z-index: -10 !important;
        pointer-events: none !important;
        transform: translateZ(0) !important;
      }
      html[data-theme="light"] #apk-ambient-bg {
        background-color: #f6f4fa !important;
        background-image: url('/bg-app-wallpaper-light.jpg') !important;
        background-size: cover !important;
        background-position: center center !important;
        background-repeat: no-repeat !important;
        opacity: 1 !important;
      }
      #apk-hamburger-btn {
        position: absolute !important;
        top: max(14px, env(safe-area-inset-top, 14px)) !important;
        left: 14px !important;
        z-index: 25000 !important;
        width: 36px !important;
        height: 36px !important;
        min-width: 36px !important;
        min-height: 36px !important;
        max-width: 36px !important;
        max-height: 36px !important;
        display: inline-flex !important;
        align-items: center !important;
        justify-content: center !important;
        opacity: 1 !important;
        visibility: visible !important;
        pointer-events: auto !important;
        margin: 0 !important;
        padding: 0 !important;
        background: rgba(30, 22, 54, 0.72) !important;
        border: 1px solid rgba(255, 255, 255, 0.16) !important;
        border-radius: 10px !important;
        backdrop-filter: blur(24px) saturate(180%) !important;
        -webkit-backdrop-filter: blur(24px) saturate(180%) !important;
        box-shadow: 2.5px 2.5px 0 0 #8E74E5, 0 4px 14px rgba(0, 0, 0, 0.28) !important;
        color: #ffffff !important;
        cursor: pointer !important;
        transform: translateZ(0) !important;
        -webkit-tap-highlight-color: transparent !important;
        outline: none !important;
      }
      [data-theme="light"] #apk-hamburger-btn {
        background: rgba(255, 255, 255, 0.88) !important;
        border: 1px solid rgba(142, 116, 229, 0.38) !important;
        box-shadow: 2.5px 2.5px 0 0 #8E74E5, 0 4px 14px rgba(108, 79, 214, 0.2) !important;
        color: #1e1b4b !important;
      }
      #apk-hamburger-btn svg {
        width: 18px !important;
        height: 18px !important;
        stroke: currentColor !important;
        stroke-width: 2.3 !important;
        fill: none !important;
        display: block !important;
      }
      @keyframes iosPageGlideIn {
        from {
          opacity: 0;
          transform: translate3d(0, 10px, 0);
        }
        to {
          opacity: 1;
          transform: translate3d(0, 0, 0);
        }
      }
      main, .main-container {
        animation: iosPageGlideIn 0.24s cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      button, a, .nav-tab {
        -webkit-tap-highlight-color: transparent !important;
        outline: none !important;
      }
    </style>
  </head>
  <body class="notes-theme-page">
    <!-- Ambient Single Unified Background Layer -->
    <div id="apk-ambient-bg" aria-hidden="true"></div>

    <!-- Options Button (Fixed Top-Left across all pages, zero overlap with island) -->
    <button id="apk-hamburger-btn" class="apk-hamburger-btn" type="button" aria-label="Open Menu &amp; Settings">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
    </button>

    <!-- Top Navigation Header (Floating Island Dock - Exactly like notes.html) -->
    <header id="app-header" class="app-header">
      <nav class="header-nav-tabs">
        <div class="nav-tabs" style="margin: 0 !important;">
          <button id="tab-live" class="nav-tab" onclick="window.location.href='/'">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <span>Home</span>
          </button>

          <button id="tab-videos" class="nav-tab" onclick="window.location.href='/all-videos.html'">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><polygon points="6 4 20 12 6 20 6 4"/></svg>
            <span>Videos</span>
          </button>

          <button id="tab-notes" class="nav-tab" onclick="window.location.href='/notes.html'">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="13" y2="17"/></svg>
            <span>Notes</span>
          </button>

          <button id="tab-tests" class="nav-tab" onclick="window.location.href='/tests.html'">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
            <span>Tests</span>
          </button>

          <button id="tab-saved" class="nav-tab" onclick="window.location.href='/saved.html'">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
            <span>Saved</span>
          </button>
        </div>
      </nav>
    </header>

    <main class="main-container" style="padding-top: max(56px, env(safe-area-inset-top, 56px));">
      <div class="pyq-portal-container">
        <!-- Compact Top Bar: Back Button & Page Title -->
        <div class="pyq-compact-header">
          <a href="/" class="pyq-back-pill" id="pyq-back-to-home">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
            <span>Home</span>
          </a>
          <h2 class="pyq-page-title">3rd Year Question Papers</h2>
        </div>

        <!-- Directly on Top: Subject Selector Chips -->
        <div class="pyq-subject-selector" id="pyq-subject-selector" role="tablist" aria-label="Select Subject"></div>

        <!-- Mode Bar: Short clean titles -->
        <div class="pyq-mode-bar" role="tablist">
          <button type="button" id="pyq-mode-priority" class="pyq-mode-btn active" role="tab" aria-selected="true">
            Repeating Topics
          </button>
          <button type="button" id="pyq-mode-papers" class="pyq-mode-btn" role="tab" aria-selected="false">
            Question Papers
          </button>
        </div>

        <!-- SECTION 1: PRIORITY REPEATING TOPICS & 2-3 PAGE ANSWERS -->
        <section id="pyq-priority-section">
          <div class="pyq-topics-list" id="pyq-topics-list"></div>
        </section>

        <!-- SECTION 2: QUESTION PAPERS (PDFs) -->
        <section id="pyq-papers-section" style="display:none;">
          <div class="pyq-papers-grid" id="pyq-papers-grid"></div>
        </section>
      </div>
    </main>

    <!-- In-App PDF.js Local Canvas Reader Modal -->
    <div id="pyq-pdf-modal" class="pyq-pdf-modal" aria-hidden="true" role="dialog">
      <div class="pyq-pdf-container">
        <div class="pyq-pdf-header">
          <span class="pyq-pdf-title" id="pyq-pdf-modal-title">Question Paper Preview</span>
          <div class="pyq-pdf-controls">
            <button type="button" id="pdf-prev-page" class="pdf-ctrl-btn" title="Previous Page">‹</button>
            <span id="pdf-page-num" class="pdf-page-indicator">1 / 1</span>
            <button type="button" id="pdf-next-page" class="pdf-ctrl-btn" title="Next Page">›</button>
            <button type="button" id="pdf-zoom-out" class="pdf-ctrl-btn" title="Zoom Out">−</button>
            <button type="button" id="pdf-zoom-in" class="pdf-ctrl-btn" title="Zoom In">+</button>
            <a id="pyq-pdf-modal-download" href="#" target="_blank" class="pdf-dl-btn" style="text-decoration:none;display:inline-flex;align-items:center;">Download</a>
            <button type="button" id="pyq-pdf-modal-close" class="pdf-close-btn" title="Close">✕</button>
          </div>
        </div>
        <div class="pyq-pdf-body" id="pyq-pdf-body">
          <div id="pyq-pdf-loading" class="pdf-loader" style="display:none;">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="animation: spin 1s linear infinite;"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-opacity="0.25"/><path d="M12 2a10 10 0 0 1 10 10" stroke="currentColor"/></svg>
            <span>Loading document...</span>
          </div>
          <canvas id="pyq-pdf-canvas"></canvas>
        </div>
      </div>
    </div>

    <!-- Script Entrypoint -->
    <script type="module" src="/src/pyqs.js"></script>
  </body>
</html>
