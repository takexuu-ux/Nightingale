<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <style>
      html, body {
        background-color: #09080e !important;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent !important;
        -webkit-touch-callout: none !important;
      }
      html[data-theme="light"], html[data-theme="light"] body {
        background-color: #f6f4fa !important;
      }
      #apk-ambient-bg {
        position: fixed !important;
        inset: 0 !important;
        width: 100vw !important;
        height: 100vh !important;
        background-color: #09080e !important;
        background-image: url('/bg-app-wallpaper.jpg') !important;
        background-attachment: fixed !important;
        background-size: cover !important;
        background-position: center center !important;
        background-repeat: no-repeat !important;
        z-index: -10 !important;
        pointer-events: none !important;
        transform: translateZ(0) !important;
      }
      html[data-theme="light"] #apk-ambient-bg {
        background-color: #f6f4fa !important;
        background-image: url('/bg-app-wallpaper-light.jpg') !important;
        background-size: cover !important;
        background-position: center center !important;
        background-repeat: no-repeat !important;
        opacity: 1 !important;
      }
      #apk-hamburger-btn {
        position: absolute !important;
        top: max(14px, env(safe-area-inset-top, 14px)) !important;
        left: 14px !important;
        z-index: 25000 !important;
        width: 34px !important;
        height: 34px !important;
        min-width: 34px !important;
        min-height: 34px !important;
        display: inline-flex !important;
        align-items: center !important;
        justify-content: center !important;
        opacity: 1 !important;
        visibility: visible !important;
        pointer-events: auto !important;
        margin: 0 !important;
        padding: 0 !important;
        background: rgba(30, 22, 54, 0.72) !important;
        border: 1px solid rgba(255, 255, 255, 0.16) !important;
        border-radius: 10px !important;
        backdrop-filter: blur(24px) saturate(180%) !important;
        -webkit-backdrop-filter: blur(24px) saturate(180%) !important;
        box-shadow: 2.5px 2.5px 0 0 #8E74E5, 0 4px 14px rgba(0, 0, 0, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.25) !important;
        color: #ffffff !important;
        cursor: pointer !important;
        transform: translateZ(0) !important;
        -webkit-tap-highlight-color: transparent !important;
        outline: none !important;
      }
      [data-theme="light"] #apk-hamburger-btn {
        background: rgba(255, 255, 255, 0.88) !important;
        border: 1px solid rgba(142, 116, 229, 0.38) !important;
        box-shadow: 2.5px 2.5px 0 0 #8E74E5, 0 4px 14px rgba(108, 79, 214, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.9) !important;
        color: #1e1b4b !important;
      }
      #apk-hamburger-btn svg {
        width: 18px !important;
        height: 18px !important;
        stroke: currentColor !important;
        stroke-width: 2.3 !important;
        fill: none !important;
        display: block !important;
      }
      @keyframes iosPageGlideIn {
        from {
          opacity: 0;
          transform: translate3d(0, 10px, 0);
        }
        to {
          opacity: 1;
          transform: translate3d(0, 0, 0);
        }
      }
      main, #catalog-view, #notes-catalog-view, #tests-catalog-view, .main-container {
        animation: iosPageGlideIn 0.24s cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      button, a, .nav-tab {
        -webkit-tap-highlight-color: transparent !important;
        outline: none !important;
      }
    </style>
    <script>
      (function(){
        try {
          var t = localStorage.getItem('nnl_app_theme');
          if (!t) {
            t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', t);
          if (window.AndroidBridge || window.__NNL_ANDROID_APK__ || (navigator.userAgent && /NightingaleAndroid/i.test(navigator.userAgent))) {
            document.documentElement.classList.add('is-native-android-apk');
          }
          var token = localStorage.getItem('token') || localStorage.getItem('nnl_access_token') || localStorage.getItem('nnl_auth_token');
          if (token) {
            document.documentElement.classList.add('is-logged-in');
            var s = document.createElement('style');
            s.textContent = '#app-preloader{display:none!important;} #apk-hamburger-btn{display:inline-flex!important;visibility:visible!important;opacity:1!important;pointer-events:auto!important;}';
            document.head.appendChild(s);
          }
        } catch(e) {}
      })();
    </script>
    <meta name="description" content="Nightingale Saved Content — Bookmarked Lectures, Notes, PDFs & Practice Question Banks." />
    <title>Nightingale — Saved Content</title>
  </head>
  <body class="notes-theme-page">
    <!-- Ambient Vector Landscape Background Layer -->
    <div id="apk-ambient-bg"></div>

    <!-- Options Button (Fixed Top-Left across all pages, zero overlap with island) -->
    <button id="apk-hamburger-btn" class="apk-icon-btn apk-hamburger-btn" type="button" aria-label="Open Menu &amp; Settings">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
    </button>

    <!-- Top Navigation Header (Floating Island) -->
    <header id="app-header" class="app-header">
      <nav class="header-nav-tabs">
        <div class="nav-tabs" style="margin: 0 !important;">
          <button id="tab-live" class="nav-tab" onclick="window.location.href='/'">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <span>Home</span>
          </button>

          <button id="tab-videos" class="nav-tab" onclick="window.location.href='/all-videos.html'">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><polygon points="6 4 20 12 6 20 6 4"/></svg>
            <span>Videos</span>
          </button>

          <button id="tab-notes" class="nav-tab" onclick="window.location.href='/notes.html'">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="13" y2="17"/></svg>
            <span>Notes</span>
          </button>

          <button id="tab-tests" class="nav-tab" onclick="window.location.href='/tests.html'">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
            <span>Tests</span>
          </button>

          <button id="tab-saved" class="nav-tab active">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
            <span>Saved</span>
          </button>
        </div>
      </nav>
    </header>

    <main id="app">
      <div class="notes-page-container">

        <!-- Header -->
        <section class="notes-hero-header">
          <div class="notes-hero-bar">
            <h1 class="notes-hero-title">Saved Content</h1>
            <div id="saved-search-box" class="notes-search-wrapper">
              <svg class="notes-search-icon" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z"/>
              </svg>
              <input
                type="text"
                id="saved-search-input"
                class="notes-search-input"
                placeholder="Search saved..."
                autocomplete="off"
              />
            </div>
          </div>
        </section>

        <!-- Top Slideable Mode Selector: Lectures / Notes & PDFs / Question Banks -->
        <div class="saved-mode-tabs">
          <button type="button" id="saved-tab-lectures" class="saved-mode-tab active" data-target="lectures">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="6 4 20 12 6 20 6 4"/></svg>
            <span>Lectures</span>
            <span id="count-lectures" class="saved-mode-badge">0</span>
          </button>
          <button type="button" id="saved-tab-notes" class="saved-mode-tab" data-target="notes">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="13" y2="17"/></svg>
            <span>Notes &amp; PDFs</span>
            <span id="count-notes" class="saved-mode-badge">0</span>
          </button>
          <button type="button" id="saved-tab-tests" class="saved-mode-tab" data-target="tests">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
            <span>Question Banks</span>
            <span id="count-tests" class="saved-mode-badge">0</span>
          </button>
        </div>

        <!-- Section 1: Saved Lectures -->
        <section id="saved-section-lectures" class="saved-content-section">
          <div id="saved-lectures-container" class="subject-lectures-container" style="display: flex; flex-direction: column; gap: 0.75rem;"></div>
        </section>

        <!-- Section 2: Saved Notes & PDFs -->
        <section id="saved-section-notes" class="saved-content-section hide">
          <div id="saved-notes-container" class="notes-subject-grid"></div>
        </section>

        <!-- Section 3: Saved Question Banks -->
        <section id="saved-section-tests" class="saved-content-section hide">
          <div id="saved-tests-container" class="tests-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1rem;"></div>
        </section>

      </div>
    </main>

    <!-- RECORDING VIEWER -->
    <div id="recording-viewer" class="recording-viewer hide">
      <div class="recording-viewer-card">
        <div class="recording-viewer-header">
          <div class="recording-viewer-meta">
            <h2 id="recording-viewer-title" style="font-family:var(--font-display);font-size:1.05rem;font-weight:700;color:var(--text-primary);margin:0;"></h2>
            <span id="recording-viewer-instructor" style="font-size:0.8rem;color:var(--text-secondary);"></span>
          </div>
          <button id="close-recording-viewer" class="btn-close-recording" title="Close" aria-label="Close lecture viewer">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
          </button>
        </div>
        <div class="recording-viewer-body">
          <video id="recording-video" class="recording-video-player hide" controls preload="metadata" playsinline>
            Your browser does not support video playback.
          </video>
          <div id="recording-no-url" class="recording-no-url hide">
            <div class="rec-app-notice-icon">
              <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"/>
              </svg>
            </div>
            <h3 id="recording-error-title" class="rec-app-notice-title">Android App Video Lecture</h3>
            <p id="recording-error-desc" class="rec-app-notice-desc">VdoCipher DRM video streaming is protected and exclusive to the Nightingale Android app.</p>
            <button id="recording-retry-btn" class="btn" style="display:none;">Retry Playback</button>
          </div>
        </div>
      </div>
    </div>

    <!-- PDF Reader Modal -->
    <div id="pdf-modal" class="pdf-modal-overlay hide">
      <div class="pdf-modal-container">
        <div class="pdf-modal-header">
          <div class="pdf-modal-title" id="pdf-modal-title">Saved PDF</div>
          <div class="pdf-modal-actions">
            <a id="pdf-modal-download-btn" href="#" target="_blank" class="btn-note-download">
              <svg width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3"/></svg>
              <span>Open Full PDF</span>
            </a>
            <button id="pdf-modal-close-btn" class="btn-close-quiz" title="Close" aria-label="Close">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
            </button>
          </div>
        </div>
        <div class="pdf-modal-body">
          <iframe id="pdf-modal-iframe" class="pdf-iframe" src=""></iframe>
        </div>
      </div>
    </div>

    <script type="module" src="/src/saved.js"></script>
  </body>
</html>
