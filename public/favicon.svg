<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Glowing Red/Pink gradient matching primary theme -->
    <linearGradient id="gradNNL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff0055;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff3377;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Soft background capsule back-circle -->
  <circle cx="50" cy="50" r="48" fill="#08090d" />
  
  <!-- Outer glowing ring -->
  <circle cx="50" cy="50" r="44" fill="none" stroke="url(#gradNNL)" stroke-width="2" opacity="0.25" />
  
  <!-- Centered Heartbeat ECG line (Nursing/Medical representation) -->
  <path d="M 18 50 L 34 50 L 39 35 L 44 63 L 50 43 L 54 55 L 58 50 L 82 50" fill="none" stroke="url(#gradNNL)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
</svg>
