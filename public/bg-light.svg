<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <!-- Sky Dawn / Morning Pastel Gradient (Soft Violet to Warm Dawn) -->
    <linearGradient id="skyGradLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C5B4F5"/>
      <stop offset="28%" stop-color="#D9CCFB"/>
      <stop offset="55%" stop-color="#E8E0FD"/>
      <stop offset="78%" stop-color="#F4EDFD"/>
      <stop offset="100%" stop-color="#FFF5EE"/>
    </linearGradient>

    <!-- Morning Sun Radiant Aura & Core -->
    <radialGradient id="sunAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF7ED" stop-opacity="1"/>
      <stop offset="42%" stop-color="#FDE8D3" stop-opacity="0.88"/>
      <stop offset="75%" stop-color="#F5C296" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#E8B888" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sunCore" cx="42%" cy="40%" r="52%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#FFF9F3"/>
      <stop offset="100%" stop-color="#FEEFD8"/>
    </radialGradient>

    <!-- Mountain Valley Layer Gradients (Pastel Iris to Muted Violet) -->
    <linearGradient id="mtnFarLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#BFAAE6"/>
      <stop offset="100%" stop-color="#9E85CD"/>
    </linearGradient>

    <linearGradient id="mtnMidFarLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9277C4"/>
      <stop offset="100%" stop-color="#7659A8"/>
    </linearGradient>

    <linearGradient id="mtnMidLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6F51A3"/>
      <stop offset="100%" stop-color="#553888"/>
    </linearGradient>

    <linearGradient id="mtnNearLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4F3182"/>
      <stop offset="100%" stop-color="#3A1F67"/>
    </linearGradient>

    <linearGradient id="canyonWallLeftLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3D226E"/>
      <stop offset="50%" stop-color="#2C1652"/>
      <stop offset="100%" stop-color="#1E0D3B"/>
    </linearGradient>

    <linearGradient id="canyonWallRightLight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#412574"/>
      <stop offset="50%" stop-color="#2E1756"/>
      <stop offset="100%" stop-color="#1E0D3B"/>
    </linearGradient>

    <!-- Atmospheric Horizontal Mist Gradient -->
    <linearGradient id="hMistLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#EAE1FB" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Sky Canvas -->
  <rect width="1080" height="1920" fill="url(#skyGradLight)"/>

  <!-- Morning Sun Nestled in Valley -->
  <circle cx="580" cy="880" r="280" fill="url(#sunAura)"/>
  <circle cx="580" cy="880" r="155" fill="url(#sunCore)"/>

  <!-- Soft Atmospheric Dawn Mist Bands across Sun -->
  <path d="M0,780 Q280,750 540,780 T1080,760 L1080,840 L0,840 Z" fill="#D6C6FB" opacity="0.35"/>
  <path d="M0,850 Q320,830 640,860 T1080,840 L1080,930 L0,930 Z" fill="#C4B0F7" opacity="0.4"/>

  <!-- Mountain Layer 1 (Far Distant Peaks) -->
  <path d="M-20,980 L140,890 L330,950 L520,870 L720,940 L910,860 L1060,910 L1100,960 L1100,1920 L-20,1920 Z" fill="url(#mtnFarLight)"/>
  <rect y="880" width="1080" height="180" fill="url(#hMistLight)"/>

  <!-- Mountain Layer 2 (Mid Distant Ridges) -->
  <path d="M-20,1080 L160,970 L390,1050 L610,950 L820,1040 L1010,970 L1100,1020 L1100,1920 L-20,1920 Z" fill="url(#mtnMidFarLight)"/>

  <!-- Mountain Layer 3 (Descending Valley Floor) -->
  <path d="M-20,1210 L180,1100 L410,1190 L630,1090 L840,1170 L1020,1100 L1100,1160 L1100,1920 L-20,1920 Z" fill="url(#mtnMidLight)"/>

  <!-- Mountain Layer 4 (Lower Foothills) -->
  <path d="M-20,1360 L210,1230 L460,1330 L700,1220 L930,1310 L1100,1240 L1100,1920 L-20,1920 Z" fill="url(#mtnNearLight)"/>

  <!-- Dramatic Foreground Canyon Wall - Left Peak Framing -->
  <path d="M-20,920 L120,1060 L60,1180 L220,1300 L110,1440 L280,1540 L160,1660 L360,1780 L1100,1920 L-20,1920 Z" fill="url(#canyonWallLeftLight)"/>

  <!-- Dramatic Foreground Canyon Wall - Right Peak Framing -->
  <path d="M1100,940 L960,1070 L1020,1200 L860,1320 L980,1460 L800,1570 L920,1690 L710,1810 L-20,1920 L1100,1920 Z" fill="url(#canyonWallRightLight)"/>

  <!-- Warm Ground Base -->
  <rect y="1760" width="1080" height="160" fill="#15082A"/>
</svg>